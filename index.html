<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>firm-MM | Web Apps</title>
  <meta name="description" content="Google AI Studioで作成したアプリを公開中。">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0d14;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 80px;
    }



    /* メインコンテナ */
    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      width: 100%;
    }

    /* ヘッダー */
    header {
      text-align: center;
      margin-bottom: 56px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent-cyan);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.85);
      }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ショーケースセクション */
    .showcase-section {
      width: 100%;
      margin: 40px 0 20px;
    }

    .showcase-divider {
      border: none;
      border-top: 1px dotted rgba(255, 255, 255, 0.25);
      margin: 0;
      width: 100%;
    }

    .showcase-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 36px 48px;
      padding: 36px 0;
    }

    .showcase-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    .showcase-img-link {
      display: block;
      flex-shrink: 0;
      width: 170px;
      height: 170px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .showcase-img-link:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .showcase-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .showcase-info {
      flex: 1;
      padding-top: 4px;
    }

    .showcase-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.4;
      color: #f1f5f9;
      text-decoration: none;
      display: inline-block;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .showcase-title:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    .showcase-title.highlight {
      color: #fb7185;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .showcase-title.highlight:hover {
      color: #fda4af;
    }

    /* Contact me セクション */
    .contact-container {
      text-align: center;
      padding: 36px 0 12px;
    }

    .contact-link {
      display: inline-block;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fb7185;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .contact-link:hover {
      color: #fda4af;
      text-decoration: underline;
      transform: translateY(-2px);
    }

    /* レスポンシブ対応 (モバイル・タブレット) */
    @media (max-width: 768px) {
      .showcase-row {
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 24px 0;
      }

      .showcase-img-link {
        width: 130px;
        height: 130px;
      }

      .showcase-title {
        font-size: 1.05rem;
      }
    }

    @media (max-width: 480px) {
      .showcase-item {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .showcase-img-link {
        width: 180px;
        height: 180px;
      }
    }

    /* フッター */
    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="badge">
        <span class="badge-dot"></span>
        <span>Apps created with AI Studio</span>
      </div>
      <h1>firm M.M. Projects</h1>
      <p class="subtitle">Publishing Projects Built with Google AI Studio</p>
    </header>

    <!-- ショーケースセクション -->
    <main class="showcase-section">
      <hr class="showcase-divider">

      <!-- 1行目: Study AI Studio & Information Security -->
      <div class="showcase-row">
        <div class="showcase-item">
          <a href="#" class="showcase-img-link" title="Showcase - Study AI Studio">
            <img src="./images/showcase-ai-studio.jpg" alt="Google AI Studio" class="showcase-img">
          </a>
          <div class="showcase-info">
            <a href="#" class="showcase-title highlight">Showcase - Study AI Studio</a>
          </div>
        </div>
        <div class="showcase-item">
          <a href="#" class="showcase-img-link" title="Showcase - Information Security">
            <img src="./images/showcase-security.jpg" alt="Information Security" class="showcase-img">
          </a>
          <div class="showcase-info">
            <a href="#" class="showcase-title">Showcase - Information Security</a>
          </div>
        </div>
      </div>

      <hr class="showcase-divider">

      <!-- 2行目: Programming & Others -->
      <div class="showcase-row">
        <div class="showcase-item">
          <a href="#" class="showcase-img-link" title="Showcase - Programing">
            <img src="./images/showcase-programming.jpg" alt="Programming" class="showcase-img">
          </a>
          <div class="showcase-info">
            <a href="#" class="showcase-title">Showcase - Programing</a>
          </div>
        </div>
        <div class="showcase-item">
          <a href="#" class="showcase-img-link" title="Showcase - Others">
            <img src="./images/showcase-others.jpg" alt="Others" class="showcase-img">
          </a>
          <div class="showcase-info">
            <a href="#" class="showcase-title">Showcase - Others</a>
          </div>
        </div>
      </div>

      <hr class="showcase-divider">

      <!-- Contact me -->
      <div class="contact-container">
        <a href="#" class="contact-link">Contact me</a>
      </div>
    </main>

    <footer>
      <p>© 2026 firm-MM • Hosted on GitHub Pages</p>
    </footer>
  </div>
</body>

</html>
