<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>firm-MM | Web Apps</title>
  <meta name="description" content="Google AI Studioで作成したアプリを公開中。">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0d14;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 80px;
    }

    /* 背景のアンビエント発光 */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      animation: float 16s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #38bdf8 0%, transparent 70%);
      top: -150px;
      left: 10%;
    }

    .orb-2 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #818cf8 0%, transparent 70%);
      bottom: -150px;
      right: 10%;
      animation-delay: -8s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(40px, 30px) scale(1.1);
      }
    }

    /* メインコンテナ */
    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      width: 100%;
    }

    /* ヘッダー */
    header {
      text-align: center;
      margin-bottom: 56px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent-cyan);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.85);
      }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* フッター */
    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="badge">
        <span class="badge-dot"></span>
        <span>Apps created with AI Studio</span>
      </div>
      <h1>firm M.M. Projects</h1>
      <p class="subtitle">制作したWebアプリケーションや実験的プロジェクトを公開中。</p>
    </header>

    <footer>
      <p>© 2026 firm-MM • Hosted on GitHub Pages</p>
    </footer>
  </div>
</body>

</html>
